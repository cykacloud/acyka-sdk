[project]
name = "acyka"
version = "1.0.0"
description = "A client for the acyka API: the catalogue, profiles, lists and writing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "acyka" }]
keywords = ["acyka", "anime", "api", "client", "oauth"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# One dependency, doing something that cannot be written in thirty lines. The
# parsers are generated instead of pulling in pydantic, which would be the
# largest thing in the package by an order of magnitude.
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://dev.acyka.cc"
Source = "https://github.com/cykacloud/acyka-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acyka"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The generated modules re-export with a star, which is what makes
# `from acyka import TitleCard` work without listing twenty-eight names twice.
ignore = ["F403", "F405"]
